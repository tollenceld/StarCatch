name: StarCatch
options:
  bundleIdPrefix: com.starcatch
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SatelliteKit:
    url: https://github.com/gavineadie/SatelliteKit.git
    from: "2.1.0"

targets:
  StarCatch:
    type: application
    platform: iOS
    sources:
      - StarCatch
      # Keep the Obsidian vault visible in Xcode without bundling thousands of source notes.
      - path: SatelliteKnowledge
        type: folder
        buildPhase: none
    preBuildScripts:
      - name: Compile Satellite Knowledge
        script: |
          python3 "$SRCROOT/Scripts/satellite_knowledge.py" compile
          if [ "${ACTION:-}" = "install" ]; then
            python3 "$SRCROOT/Scripts/release_check.py"
          fi
        basedOnDependencyAnalysis: false
        showEnvVars: false
    dependencies:
      - package: SatelliteKit
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.starcatch.StarCatch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8SJJ8MN7H8
      configs:
        Release:
          VALIDATE_PRODUCT: YES
    info:
      path: StarCatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleDisplayName: StarCatch
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: 用于确定真北方向与观测者坐标，使天空标注与真实方位对齐。
        NSLocationDefaultAccuracyReduced: true
        NSMotionUsageDescription: 用于读取设备姿态，使准星与手机实际指向的天空区域保持对齐。
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false

  StarCatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StarCatchTests
    dependencies:
      - target: StarCatch
      - package: SatelliteKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/StarCatch.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StarCatch
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  StarCatch:
    build:
      targets:
        StarCatch: all
    test:
      targets:
        - StarCatchTests
